<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Mosaic app icon</title>
  <desc id="description">Four colorful tesserae form a geometric letter M on a deep indigo rounded square.</desc>
  <defs>
    <linearGradient id="shell" x1="120" y1="86" x2="895" y2="954" gradientUnits="userSpaceOnUse">
      <stop stop-color="#211547"/>
      <stop offset="0.5" stop-color="#11182F"/>
      <stop offset="1" stop-color="#07151D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(512 382) rotate(90) scale(548)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED" stop-opacity=".27"/>
      <stop offset=".58" stop-color="#2563EB" stop-opacity=".09"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="violet" x1="228" y1="246" x2="372" y2="778" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#6D5DFB"/>
    </linearGradient>
    <linearGradient id="orchid" x1="380" y1="246" x2="527" y2="548" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F472B6"/>
      <stop offset=".52" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="sky" x1="644" y1="246" x2="500" y2="548" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset=".48" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="mint" x1="796" y1="246" x2="652" y2="778" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <filter id="shellShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#020617" flood-opacity=".52"/>
    </filter>
    <filter id="tileShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="17" flood-color="#020617" flood-opacity=".38"/>
    </filter>
    <clipPath id="shellClip">
      <rect x="58" y="58" width="908" height="908" rx="218"/>
    </clipPath>
  </defs>

  <rect x="58" y="58" width="908" height="908" rx="218" fill="url(#shell)" filter="url(#shellShadow)"/>
  <g clip-path="url(#shellClip)">
    <rect x="58" y="58" width="908" height="908" fill="url(#glow)"/>
    <path d="M88 790C279 647 441 655 575 718c127 60 238 54 391-40v288H58V820l30-30Z" fill="#020617" opacity=".18"/>
    <circle cx="846" cy="174" r="164" fill="#22D3EE" opacity=".045"/>
    <circle cx="172" cy="840" r="206" fill="#A855F7" opacity=".055"/>
  </g>
  <rect x="67" y="67" width="890" height="890" rx="210" fill="none" stroke="#FFFFFF" stroke-opacity=".12" stroke-width="7"/>

  <g filter="url(#tileShadow)" stroke="#FFFFFF" stroke-opacity=".18" stroke-width="5" stroke-linejoin="round">
    <rect x="224" y="244" width="136" height="536" rx="45" fill="url(#violet)"/>
    <path d="M382 279c0-33 39-50 63-28l67 62v219c0 32-38 49-61 27l-55-54a46 46 0 0 1-14-33V279Z" fill="url(#orchid)"/>
    <path d="M642 279c0-33-39-50-63-28l-67 62v219c0 32 38 49 61 27l55-54a46 46 0 0 0 14-33V279Z" fill="url(#sky)"/>
    <rect x="664" y="244" width="136" height="536" rx="45" fill="url(#mint)"/>
  </g>

  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" opacity=".34">
    <path d="M258 286v268" stroke-width="10"/>
    <path d="M420 291l70 64" stroke-width="9"/>
    <path d="M604 291l-70 64" stroke-width="9"/>
    <path d="M698 286v268" stroke-width="10"/>
  </g>
</svg>
